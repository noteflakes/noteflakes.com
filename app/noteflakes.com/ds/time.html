<!DOCTYPE html>
<html>
  <head>
    <title>Data-Star Test</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.4/bundles/datastar.js">
    </script>
  </head>
  <body>
    <h2>Server state</h2>
    <h3><a href="https://github.com/noteflakes/noteflakes.com/blob/main/app/noteflakes.com/ds/time_stream.rb">Controller module source</a></h3>
    <div data-init="@get('./time_stream')">
      <p>
        <span>Time:</span> <span data-text="$time"/>
      </p>
      <p>
        <span>Load average:</span> <span data-text="$load_avg"/>
      </p>
      <p>
        <span>Connections:</span> <span data-text="$connections"/>
      </p>
    </div>
  </body>
</html>
