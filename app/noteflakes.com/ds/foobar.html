<!DOCTYPE html>
<html>
  <head>
    <title>Data-Star Test</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.4/bundles/datastar.js">
    </script>
  </head>
  <body 
    data-signals="{ foo: { bar: 42 } }"
    data-init="Datastar.start($foo);"
  >
    <p>Foo: <span data-text="$foo.bar" /></p>
    <p>
      <a href="/time" data-on:click__prevent="@get('/ds/time'); history.pushState({}, '', '/ds/time')">Time</a>
    </p>
    <script>
      window.Datastar = {
        start: (foo) => {
          window.Datastar.foo = foo;
          setInterval(() => window.Datastar.foo.bar++, 1000)
        }
        
      };

      window.addEventListener("popstate", (e) => {
        const href = document.location.href;
        document.body.dataset["on:triggerAction"] = `@get('${href}')`;
        setTimeout(() => document.body.dispatchEvent(new CustomEvent("trigger-action")), 0);
      });
    </script>
  </body>
</html>
